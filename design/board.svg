<svg xmlns="http://www.w3.org/2000/svg" width="60" height="48" viewBox="0 0 60 48" shape-rendering="crispEdges">
  <!-- Drawn on the pixel grid it is shown at, so every edge lies between two
       pixels and nothing is smoothed when it is rendered at this size. A 1 pixel
       line runs along pixel centers at .5, and every other shape starts and ends
       on whole numbers. Light falls from the upper left, as on NeXT's icons. -->

  <!-- The board, in the dark gray of the NeXTstation, with its corners cut. -->
  <path d="M1 0H56V1H57V44H56V45H1V44H0V1H1Z" fill="#000"/>
  <rect x="1" y="1" width="55" height="43" fill="#aaa"/>
  <rect x="2" y="2" width="54" height="42" fill="#555"/>

  <!-- Traces. -->
  <path fill="none" stroke="#6c6c6c" d="
    M15.5 7V13M17.5 7V13M19.5 7V13M21.5 7V13
    M29.5 7V14M31.5 7V14M33.5 7V14
    M24 16.5H27M24 18.5H27M24 20.5H27M24 22.5H27
    M12.5 25V39M14.5 25V39
    M21.5 25V40M23.5 25V40
    M32.5 24V29M34.5 24V29
    M39 31.5H43M39 33.5H43M39 35.5H43
    M39 30.5H41M40.5 23V30M41 23.5H44
    M37.5 9V29M38 9.5H44
    M7 18.5H12M7 20.5H12"/>

  <!-- Mounting holes, each a gilded ring. -->
  <g fill="#d9b13a">
    <rect x="4" y="3" width="2" height="4"/><rect x="3" y="4" width="4" height="2"/>
    <rect x="39" y="3" width="2" height="4"/><rect x="38" y="4" width="4" height="2"/>
    <rect x="4" y="38" width="2" height="4"/><rect x="3" y="39" width="4" height="2"/>
    <rect x="39" y="38" width="2" height="4"/><rect x="38" y="39" width="4" height="2"/>
  </g>
  <g fill="#000">
    <rect x="4" y="4" width="2" height="2"/>
    <rect x="39" y="4" width="2" height="2"/>
    <rect x="4" y="39" width="2" height="2"/>
    <rect x="39" y="39" width="2" height="2"/>
  </g>

  <!-- The pin header along the top edge: two rows of pins in a black housing. -->
  <rect x="8" y="2" width="29" height="5" fill="#000"/>
  <path fill="none" stroke="#d9b13a" stroke-dasharray="1 1" d="M9 3.5H36M9 5.5H36"/>

  <!-- The processor under its metal lid. -->
  <rect x="12" y="13" width="12" height="12" fill="#000"/>
  <rect x="13" y="14" width="10" height="10" fill="#fff"/>
  <rect x="14" y="15" width="9" height="9" fill="#555"/>
  <rect x="14" y="15" width="8" height="8" fill="#aaa"/>

  <!-- Two black chips: the memory beside the processor, and the one that
       drives the ports. -->
  <rect x="27" y="14" width="8" height="10" fill="#000"/>
  <rect x="28" y="15" width="6" height="8" fill="#3c3c3c"/>
  <rect x="29" y="16" width="5" height="7" fill="#1e1e1e"/>
  <rect x="31" y="29" width="8" height="8" fill="#000"/>
  <rect x="32" y="30" width="6" height="6" fill="#3c3c3c"/>
  <rect x="33" y="31" width="5" height="5" fill="#1e1e1e"/>

  <!-- Small parts, and the two lamps at the left edge. -->
  <g fill="#aaa">
    <rect x="5" y="10" width="2" height="1"/>
    <rect x="5" y="12" width="2" height="1"/>
    <rect x="5" y="18" width="2" height="1"/>
    <rect x="5" y="20" width="2" height="1"/>
    <rect x="17" y="30" width="2" height="1"/>
    <rect x="17" y="33" width="2" height="1"/>
    <rect x="27" y="28" width="2" height="1"/>
    <rect x="27" y="31" width="2" height="1"/>
  </g>
  <rect x="4" y="27" width="2" height="1" fill="#e0302a"/>
  <rect x="4" y="30" width="2" height="1" fill="#2ec84a"/>

  <!-- The connectors along the bottom edge, standing out past it. -->
  <g>
    <rect x="8" y="39" width="8" height="9" fill="#000"/>
    <rect x="9" y="40" width="6" height="7" fill="#fff"/>
    <rect x="10" y="41" width="5" height="6" fill="#555"/>
    <rect x="10" y="41" width="4" height="5" fill="#aaa"/>
    <rect x="19" y="40" width="7" height="8" fill="#000"/>
    <rect x="20" y="41" width="5" height="6" fill="#fff"/>
    <rect x="21" y="42" width="4" height="5" fill="#555"/>
    <rect x="21" y="42" width="3" height="4" fill="#aaa"/>
    <rect x="28" y="40" width="7" height="8" fill="#000"/>
    <rect x="29" y="41" width="5" height="6" fill="#fff"/>
    <rect x="30" y="42" width="4" height="5" fill="#555"/>
    <rect x="30" y="42" width="3" height="4" fill="#aaa"/>
  </g>

  <!-- The ports along the right edge, standing out past it: two pairs of USB
       sockets and the network socket. -->
  <g>
    <rect x="44" y="3" width="16" height="12" fill="#000"/>
    <rect x="45" y="4" width="14" height="10" fill="#fff"/>
    <rect x="46" y="5" width="13" height="9" fill="#555"/>
    <rect x="46" y="5" width="12" height="8" fill="#aaa"/>
    <rect x="44" y="17" width="16" height="12" fill="#000"/>
    <rect x="45" y="18" width="14" height="10" fill="#fff"/>
    <rect x="46" y="19" width="13" height="9" fill="#555"/>
    <rect x="46" y="19" width="12" height="8" fill="#aaa"/>
    <rect x="43" y="31" width="17" height="13" fill="#000"/>
    <rect x="44" y="32" width="15" height="11" fill="#fff"/>
    <rect x="45" y="33" width="14" height="10" fill="#555"/>
    <rect x="45" y="33" width="13" height="9" fill="#aaa"/>
  </g>
</svg>
