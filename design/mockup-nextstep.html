   * the end of the transition, because a page in a tab nobody is looking at
   * may never run it, and a notification that stays half gone is in the way.
   */
  withdraw(name) {
    const shown = this.shown(name);
    if (!shown) return;
    shown.toggleAttribute("leaving", true);
    if (globalThis.matchMedia?.("(prefers-reduced-motion: reduce)").matches) {
      shown.remove();
      return;
    }

    shown.style.height = `${shown.offsetHeight}px`;
    shown.style.transition =
      `height ${SLIDE_MS}ms ease-in-out, margin-bottom ${SLIDE_MS}ms ease-in-out`;
    shown.getBoundingClientRect();
    shown.style.height = "0px";
    shown.style.marginBottom = "0px";
    shown.style.borderWidth = "0px";
    const gone = () => shown.remove();
    shown.addEventListener("transitionend", gone, { once: true });
    setTimeout(gone, SLIDE_MS + 50);
  }

  /** @returns {string[]} The names of the notifications standing now, top
   *  first, leaving out any that are on their way out. */
  get names() {
    return this.standing().map((shown) => shown.dataset.name ?? "");
  }

  /**
   * One notification that is standing, by its name.
   * @param {string} name
   * @returns {NxNotification | null}
   */
  shown(name) {
    return this.standing().find((shown) => shown.dataset.name === name) ?? null;
  }

  /** @returns {NxNotification[]} Every notification standing, top first. */
  standing() {
    return [...this.querySelectorAll("nx-notification:not([leaving])")]
      .filter((shown) => shown instanceof NxNotification);
  }
}

/* --- nx-viewer ---------------------------------------------------------- */

/**
 * One icon in the viewer: a step of the path, a thing in the contents, or one
 * kept on the shelf.
 * @typedef {object} ViewerEntry
 * @property {string} [label] - The name under it.
 * @property {string} [icon] - Which picture, by the name showArt knows.
 * @property {string} [value] - What choosing it hands over. Left out, it hands
 *   nothing over.
 * @property {boolean} [folder] - In the contents, that it has more inside.
 * @property {boolean} [dockable] - That it is an application, which the dock
 *   takes when it is carried there.
 */

/**
 * NeXTSTEP's File Viewer, which is four bands stacked in one window.
 *
 * The shelf along the top keeps whatever is dropped on it and has nothing to
 * do with where you are. Under it one line of status about the whole. Then the
 * path, as a row of icons with an arrow between each pair. Then what the last
 * step of that path holds, in a scroller.
 *
 * It knows nothing about what it is showing. The page hands it a path and a
 * list of contents and listens for what was chosen, so the same component
 * serves machines, a shared directory, or anything else that is a place with
 * things in it.
 *
 * @attr status - The line under the shelf, where the page has nothing more
 *   particular to say.
 * @fires nx-path - A step of the path was chosen, carrying its index in
 *   `detail.index` and its value in `detail.value`.
 * @fires nx-visit - Something on the shelf was clicked once, carrying its
 *   value. One click there is an act rather than a selection.
 * @fires nx-choose - Something in the contents or on the shelf was chosen,
 *   from nx-thing, carrying its value.
 */
class NxViewer extends HTMLElement {
  connectedCallback() {
    if (this.ready) return;
    this.ready = true;

    /** @type {NxShelf} */
    this.keep = document.createElement("nx-shelf");
    this.keep.className = "keep";

    /* One click on the shelf is an act, which is the one place in this viewer
       where that is true: NeXT's guidelines say that clicking a folder there
       changes what the viewer shows, and that a drag must not do the same,
       which is why the shelf is the example they use for it. */
    this.keep.addEventListener("click", (event) => {
      const thing = closestTo(event, "nx-thing");
      if (!thing || !this.keep.contains(thing)) return;
      /* Raised on the thing rather than on the viewer, so that whoever
         answers knows which icon was clicked and not merely that one was.
         An icon that travels has to start where it is. */
      thing.dispatchEvent(new CustomEvent("nx-visit", {
        bubbles: true,
        detail: { value: thing.getAttribute("value") },
      }));
    });
    this.keep.addEventListener("dragover", (event) => {
      event.preventDefault();
      if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
      this.keep.setAttribute("droppable", "");
    });
    this.keep.addEventListener("dragleave", (event) => {
      const into = event.relatedTarget;
      if (!(into instanceof Node && this.keep.contains(into))) {
        this.keep.removeAttribute("droppable");
      }
    });
    this.keep.addEventListener("drop", (event) => {
      event.preventDefault();
      this.keep.removeAttribute("droppable");
      this.dispatchEvent(new CustomEvent("nx-keep", {
        bubbles: true,
        detail: { value: event.dataTransfer?.getData("text/plain") ?? "" },
      }));
    });

    /** @type {HTMLParagraphElement} */
    this.status = document.createElement("p");
    this.status.className = "status";
    this.status.textContent = this.getAttribute("status") ?? "";

    /** @type {HTMLDivElement} */
    this.path = document.createElement("div");
    this.path.className = "path";
    this.path.addEventListener("click", (event) => {
      const thing = closestTo(event, "nx-thing");
      if (!thing || !this.path.contains(thing)) return;
      this.dispatchEvent(new CustomEvent("nx-path", {
        bubbles: true,
        detail: { index: Number(thing.dataset.step), value: thing.getAttribute("value") },
      }));
    });

    /* The path is a browser in the original and scrolls sideways as it grows,
       with its trough under it whether there is anything to scroll or not. */
    const way = document.createElement("nx-scroller");
    way.setAttribute("bars", "across");
    way.className = "way";
    way.append(this.path);

    /** @type {NxShelf} */
    this.contents = document.createElement("nx-shelf");
    this.contents.className = "contents";
    const scroller = document.createElement("nx-scroller");
    scroller.setAttribute("bars", "down across");
    scroller.append(this.contents);

    this.append(this.keep, this.status, way, scroller);
  }

  /**
   * Puts a place and its contents in the window.
   * @param {object} view
   * @param {ViewerEntry[]} [view.path] - The way here, outermost first.
   * @param {ViewerEntry[]} [view.contents] - What the last step holds.
   * @param {ViewerEntry[]} [view.keeps] - What lies on the shelf. Left out,
   *   the shelf is not touched.
   * @param {string} [view.status] - The line under the shelf.
   */
  show({ path = [], contents = [], keeps, status }) {
    if (status !== undefined) this.status.textContent = status;
    if (keeps !== undefined) {
      this.keep.replaceChildren(...keeps.map((entry) => this.thing(entry)));
    }

    this.path.replaceChildren(...path.flatMap((step, index) => {
      const thing = this.thing(step);
      thing.dataset.step = String(index);
      /* The last step is where you are, and the shape that says so is the one
         a chosen thing already wears. */
      if (index === path.length - 1) thing.setAttribute("chosen", "");
      if (index === 0) return [thing];
      return [this.arrow(), thing];
    }));

    this.contents.replaceChildren(...contents.map((entry) => {
      const thing = this.thing(entry);
      if (entry.folder) thing.setAttribute("folder", "");
      return thing;
    }));
  }

  /**
   * @param {ViewerEntry} entry - What to draw.
   * @returns {NxThing} The icon with its name, ready to be appended.
   */
  thing(entry) {
    const thing = document.createElement("nx-thing");
    thing.setAttribute("icon", entry.icon ?? "");
    thing.setAttribute("label", entry.label ?? "");
    if (entry.value !== undefined) thing.setAttribute("value", entry.value);
    thing.toggleAttribute("dockable", Boolean(entry.dockable));
    return thing;
  }

  /** @returns {HTMLElement} The mark between two steps of the path. */
  arrow() {
    const arrow = document.createElement("i");
    arrow.className = "step-arrow";
    return arrow;
  }
}

/* --- nx-slider ----------------------------------------------------------- */

/** What a step stands for, as whoever uses the slider counts it.
 *  @typedef {string | number} SliderValue */

/**
 * One step on the scale.
 * @typedef {object} SliderStep
 * @property {SliderValue} value - What landing on it hands back.
 * @property {string} label - What it is called, read out to assistive
 *   technology.
 * @property {string} [tick] - What stands over it on the scale, which is the
 *   figure alone.
 */

/**
 * A knob in a trough, moving between the steps it is given.
 *
 * It holds no scale of its own: whatever uses it hands over the steps and what
 * each is called, and hears back which one was landed on. So a slider here says
 * nothing about megahertz or megabytes, and the words stay with whoever owns
 * them.
 *
 * @attr dragging - Set while the knob follows the pointer, which is what takes
 *   the travel off it so it does not trail behind the hand.
 * @attr fixed - Set where there is only one step, so the control reads as a
 *   statement rather than as a choice.
 * @fires nx-slide - `{ value }` of the step landed on, whenever that changes.
 *
 * Its steps, its unit and its value are kept from whenever they are given and
 * drawn once it is on the page, so whoever builds one can fill it in before or
 * after putting it somewhere.
 */
class NxSlider extends HTMLElement {
  /** @type {SliderStep[]} The steps, in the order they sit on the scale. */
  steps = [];

  /** @type {string} What the figures are counted in, as last given. */
  words = "";

  connectedCallback() {
    if (this.ready) return;
    this.ready = true;

    /** @type {HTMLDivElement} */
    this.trough = document.createElement("div");
    this.trough.className = "trough";
    /** @type {HTMLDivElement} */
    this.knob = document.createElement("div");
    this.knob.className = "knob";
    this.trough.append(this.knob);

    /* The ticks stand over the trough, each above the place its step puts the
       knob, so the scale is read before the hand reaches it rather than from
       under the hand that is on it. */
    /** @type {HTMLDivElement} */
    this.ticks = document.createElement("div");
    this.ticks.className = "ticks";

    const scale = document.createElement("div");
    scale.className = "scale";
    scale.append(this.ticks, this.trough);

    /* The unit, once, to the left of the scale. The ticks carry figures alone
       and the one in force is the black one, so the unit is the only thing left
       to say and saying it beside every tick would crowd them out. */
    /** @type {HTMLSpanElement} */
    this.unit = document.createElement("span");
    this.unit.className = "unit";
    this.unit.textContent = this.words;

    this.append(this.unit, scale);

    this.tabIndex = 0;
    this.setAttribute("role", "slider");
    this.wire();
    this.drawTheTicks();
    this.draw();
  }

  /** @param {string} unit - What the figures on this scale are counted in,
   *  such as MHz or MB. Stated once, to the left of the scale. */
  set says(unit) {
    this.words = unit;
    if (this.ready) this.unit.textContent = unit;
  }

  /**
   * The steps this slider offers.
   * @param {SliderStep[]} steps - In the order they sit on the scale. A tick
   *   is the figure alone: the unit stands once to the left of the scale, and
   *   five of them along one trough would not fit.
   *
   * Set every time the answer changes, because which steps exist depends on the
   * machine: a clock gains one with a turbo board, and memory loses two without
   * it.
   */
  set options(steps) {
    this.steps = steps;
    this.toggleAttribute("fixed", steps.length < 2);
    this.setAttribute("aria-valuemin", "0");
    this.setAttribute("aria-valuemax", String(Math.max(steps.length - 1, 0)));
    this.drawTheTicks();
    this.draw();
  }

  /** Puts one tick under each step, where that step puts the knob.
   *
   *  A scale of one step draws none, because there is nothing to choose
   *  between and a lone tick would read as a mark somebody could aim at. */
  drawTheTicks() {
    if (!this.ready) return;
    const last = Math.max(this.steps.length - 1, 1);
    this.ticks.replaceChildren(...(this.steps.length < 2 ? [] :
      this.steps.map((step, at) => {
        const tick = document.createElement("span");
        tick.className = "tick";
        tick.textContent = step.tick ?? "";
        /* Under the middle of the knob when it stands on this step, which is
           half a knob in plus that step's share of the room it travels. */
        tick.style.left =
          `calc(var(--knob-width) / 2 + (100% - var(--knob-width)) * ${at / last})`;
        return tick;
      })));
  }

  /** @returns {SliderValue | undefined} The value of the step the knob is on,
   *  or nothing before one has been chosen. */
  get value() {
    return this.at === undefined ? undefined : this.steps[this.at]?.value;
  }

  /** @param {SliderValue | undefined} value - Which step to stand on. One that
   *  is not a step leaves the knob at the start, which is what a machine that
   *  has just changed answers with. */
  set value(value) {
    const found = this.steps.findIndex((step) => step.value === value);
    /** @type {number | undefined} Which step the knob is on, from 0, once one
     *  has been chosen. */
    this.at = found < 0 ? 0 : found;
    this.draw();
  }

  /** Puts the knob where its step is and says what that step is called. */
  draw() {
    if (!this.ready) return;
    const at = this.at ?? 0;
    const last = Math.max(this.steps.length - 1, 1);
    /* In per cent of the room the knob has to travel, which is the trough less
       the knob itself. Stated that way rather than in pixels, so it is right
       before the trough has been laid out and stays right when it changes
       width. */
    this.knob.style.transform =
      `translateX(calc((100cqw - var(--knob-width)) * ${at / last}))`;
    this.setAttribute("aria-valuenow", String(at));
    this.setAttribute("aria-valuetext", this.steps[at]?.label ?? "");

    /* Which tick is in force, so the scale says where the knob stands as well
       as the knob does. */
    for (const [index, tick] of [...this.ticks.children].entries()) {
      tick.toggleAttribute("chosen", index === at);
    }
  }

  /** Listens for the pointer on the trough and for the arrow keys. */
  wire() {
    this.trough.addEventListener("pointerdown", (event) => {
      if (this.hasAttribute("fixed")) return;
      this.setAttribute("dragging", "");
      this.trough.setPointerCapture(event.pointerId);
      this.reachFor(event);
    });

    this.trough.addEventListener("pointermove", (event) => {
      if (this.hasAttribute("dragging")) this.reachFor(event);
    });

    for (const ending of ["pointerup", "pointercancel"]) {
      this.trough.addEventListener(ending, () => this.removeAttribute("dragging"));
    }

    this.addEventListener("keydown", (event) => {
      const by = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 }[event.key];
      if (by === undefined || this.hasAttribute("fixed")) return;
      event.preventDefault();
      this.land((this.at ?? 0) + by);
    });
  }

  /**
   * Lands on the step nearest where the pointer is.
   * @param {PointerEvent} event
   */
  reachFor(event) {
    const trough = this.trough.getBoundingClientRect();
    const knob = this.knob.getBoundingClientRect();
    /* Measured from the middle of the knob, so the step under the pointer is
       the one it looks like rather than the one half a knob to its left. */
    const along = event.clientX - trough.left - knob.width / 2;
    const room = trough.width - knob.width;
    const last = Math.max(this.steps.length - 1, 1);
    this.land(Math.round((along / (room || 1)) * last));
  }

  /**
   * Stands on one step, where that is a step at all.
   * @param {number} at - Which of them, from 0.
   */
  land(at) {
    const wanted = Math.min(Math.max(at, 0), this.steps.length - 1);
    if (wanted === this.at) return;
    this.at = wanted;
    this.draw();
    this.dispatchEvent(new CustomEvent("nx-slide", {
      bubbles: true, detail: { value: this.value },
    }));
  }
}

/* --- nx-chart ------------------------------------------------------------ */

/** How many readings a chart shows where it does not say: as many columns of
 *  four pixels with two between as fill the width a reading has in an info
 *  panel. */
const CHART_COLUMNS = 36;

/** How many lamps a column has where it does not say. Nine is what fits in a
 *  field as tall as two rows of readings. */
const CHART_LAMPS = 9;

/**
 * A history of readings as columns of lamps, the newest on the right.
 *
 * NeXTSTEP drew no charts, so this is built from the desk's own row of lamps,
 * nx-leds, turned on its side and repeated: the same sunken black field, the
 * same lamps lit from the bottom, green, then orange and red near the top.
 * Each column is one reading, and a new one moves every column a place to the
 * left.
 *
 * It knows numbers and nothing about what they measure. Whoever uses it says
 * what the top of the field stands for, whether it grows with a reading above
 * that, and from which value a lamp lights orange and red. The colors follow
 * the value a lamp stands for rather than its place, so where the field grows,
 * a lamp that was red can turn green.
 *
 * @attr columns - How many readings it shows. CHART_COLUMNS where it does not
 *   say.
 * @attr lamps - How many lamps a column has. CHART_LAMPS where it does not
 *   say.
 */
class NxChart extends HTMLElement {
  /** @type {(number | null)[]} The readings shown, oldest first, null where
   *  there was none. */
  history = [];

  /** @type {number} What the top of the field stands for, at the least. */
  floor = 100;

  /** @type {boolean} Whether the top rises to the highest reading in view,
   *  rounded up, where that is above `floor`. */
  grows = false;

  /** @type {number} From which value a lamp lights orange. */
  warm = Infinity;

  /** @type {number} From which value a lamp lights red. */
  hot = Infinity;

  connectedCallback() {
    if (this.ready) return;
    this.ready = true;

    this.field = document.createElement("div");
    this.field.className = "field";
    const columns = Number(this.getAttribute("columns")) || CHART_COLUMNS;
    const lamps = Number(this.getAttribute("lamps")) || CHART_LAMPS;
    for (let column = 0; column < columns; column += 1) {
      const standing = document.createElement("div");
      standing.className = "column";
      for (let lamp = 0; lamp < lamps; lamp += 1) {
        const led = document.createElement("i");
        /* `led`, as in nx-leds, and not `lamp`: that is the lamp beside a
           state in panel.css, nine pixels with a border, and a chart's lamp
           wearing it would spill over its neighbors. */
        led.className = "led";
        standing.append(led);
      }
      this.field.append(standing);
    }
    this.append(this.field);
    this.history = Array(columns).fill(null);
    this.draw();
  }

  /**
   * Adds a reading on the right and lets the oldest go on the left.
   * @param {number | null} value - The reading, or null where there was none,
   *   which lights nothing in its column.
   */
  push(value) {
    this.history.push(Number.isFinite(value) ? value : null);
    this.history.shift();
    this.draw();
  }

  /** Empties every column, for a chart that starts again from now. */
  clear() {
    this.history = this.history.map(() => null);
    this.draw();
  }

  /** @returns {number} What the top of the field stands for now. */
  top() {
    if (!this.grows) return this.floor;
    const highest = Math.max(...this.history.filter((value) => value !== null), 0);
    return Math.max(this.floor, Math.ceil(highest));
  }

  /** Lights each column as high as its reading is of the top, and gives every
   *  lamp the color of the value it stands for. */
  draw() {
    if (!this.field) return;
    const top = this.top();
    const columns = [...this.field.children];
    for (const [index, column] of columns.entries()) {
      const value = this.history[index];
      const lamps = /** @type {HTMLElement[]} */ ([...column.children]);
      const lit = value === null || top <= 0
        ? 0 : Math.round(Math.min(Math.max(value / top, 0), 1) * lamps.length);
      for (const [place, lamp] of lamps.entries()) {
        lamp.toggleAttribute("lit", place < lit);
        const stands = (place + 1) / lamps.length * top;
        const zone = stands > this.hot ? "hot" : stands > this.warm ? "warm" : null;
        if (zone) {
          lamp.setAttribute("zone", zone);
          lamp.style.removeProperty("--along");
          continue;
        }
        lamp.removeAttribute("zone");
        /* A green lamp grows paler with the value it stands for, up to where
           orange begins, or up the whole column where nothing warns. */
        lamp.style.setProperty("--along", alongTheGreen(Number.isFinite(this.warm)
          ? stands / this.warm : place / Math.max(lamps.length - 1, 1)));
      }
    }
  }
}

/* --- nx-leds ------------------------------------------------------------- */

/** How many lamps a row has where it does not say. Twenty is one lamp for
 *  every five per cent, which is as fine as an eye reads a row of lamps at a
 *  glance and still fits beside a label in a panel. */
const LEDS_IN_A_ROW = 20;

/** Where along a row the lamps stop being green, as shares of the row: from
 *  here they light orange, and from LEDS_HOT_FROM red, the way a level meter
 *  warns as it nears its end. A row of twenty lights fourteen green, four
 *  orange and two red. */
const LEDS_WARM_FROM = 0.7;
const LEDS_HOT_FROM = 0.9;

/** How quickly the lamps follow a new share: the time they take to cover all
 *  but a third of the way, after which they slow as they arrive. A row fed a
 *  share five times a second has gone 94 per cent of the way before the next
 *  one comes. */
const LEDS_FOLLOW_MS = 70;

/** How close to the share given the row counts as there, in per cent. Well
 *  under a lamp, so the row stops moving only once it lights what the share
 *  lights. */
const LEDS_ARRIVED = 0.5;

/**
 * How far along the green part of a row or a column a lamp stands, as the
 * stylesheet's `--along` reads it, which grades its green from darker to
 * paler.
 * @param {number} share - From 0 at the start of the green part to 1 at its
 *   end. Anything beyond is held to that.
 * @returns {string} The share to three places, as a custom property takes it.
 */
function alongTheGreen(share) {
  return String(Number(Math.min(Math.max(share, 0), 1).toFixed(3)));
}

/**
 * A row of lamps lighting from the left, for a share of something.
 *
 * It holds no scale beyond the share itself: whoever uses it hands over a
 * percentage and the words for it, and the words stay with whoever owns them.
 *
 * A new share is not jumped to. The row lights or puts out the lamps between
 * one after another and slows as it arrives, the way a meter's needle swings,
 * so a load that changes reads as a load changing rather than as a twitch.
 * Each lamp is still on or off, because a lamp has no state between the two.
 * What the row says in words, and to assistive technology, is the share given
 * at once. Where the reader has asked for less movement the lamps show it at
 * once as well.
 *
 * @attr lamps - How many lamps the row has. LEDS_IN_A_ROW where it does not
 *   say.
 */
class NxLeds extends HTMLElement {
  /** @type {number | null} The share last given, in per cent, or null where
   *  there is no reading. */
  share = null;

  /** @type {number} The share the lamps show now, which follows `share`. */
  shown = 0;

  /** @type {number} The animation frame asked for, or 0 while the lamps are
   *  still. */
  frame = 0;

  /** @type {number | undefined} When the lamps were last moved, by the clock
   *  the animation frames are given. */
  moved = undefined;

  connectedCallback() {
    if (this.ready) return;
    this.ready = true;

    this.row = document.createElement("div");
    this.row.className = "lamps";
    const count = Number(this.getAttribute("lamps")) || LEDS_IN_A_ROW;
    const green = Math.ceil(count * LEDS_WARM_FROM);
    for (let lamp = 0; lamp < count; lamp += 1) {
      const led = document.createElement("i");
      led.className = "led";
      /* Each lamp keeps the color of its place in the row, so a row filling
         up goes green, then orange, then red, and the color says how near
         the end the share is before the figure is read. The green ones grow
         paler towards the orange. */
      const along = lamp / count;
      if (along >= LEDS_HOT_FROM) led.setAttribute("zone", "hot");
      else if (along >= LEDS_WARM_FROM) led.setAttribute("zone", "warm");
      else led.style.setProperty("--along", alongTheGreen(lamp / Math.max(green - 1, 1)));
      this.row.append(led);
    }

    /* Beside the row rather than over it, the way the unit stands beside a
       slider, so the lamps are never covered by what they mean. */
    this.figure = document.createElement("span");
    this.figure.className = "says";
    this.figure.textContent = this.words ?? "";
    if (this.longest) this.figure.dataset.widest = this.longest;

    this.append(this.row, this.figure);
    this.setAttribute("role", "meter");
    this.setAttribute("aria-valuemin", "0");
    this.setAttribute("aria-valuemax", "100");
    /* A row that arrives with a share already given shows it, rather than
       swinging up to it from nothing. */
    this.shown = this.held() ?? 0;
    this.draw();
  }

  /** @returns {number|null} The share last given, in per cent. */
  get value() {
    return this.share;
  }

  /**
   * @param {number|null} percent - How full whatever it measures is, from 0
   *   to 100. Anything outside that lights all of the row or none of it, and
   *   null is a reading that is not there, which lights nothing.
   *
   * Kept even before the row is on the page, and drawn once it arrives, so
   * whoever builds one can fill it in before or after putting it somewhere.
   */
  set value(percent) {
    this.share = Number.isFinite(percent) ? percent : null;
    const held = this.held();
    if (held === null) this.removeAttribute("aria-valuenow");
    else this.setAttribute("aria-valuenow", String(held));
    this.follow();
  }

  /** @returns {number|null} The share given, held between 0 and 100, or null
   *  where there is no reading. */
  held() {
    return this.share === null ? null : Math.min(Math.max(this.share, 0), 100);
  }

  /** @param {string} words - What the share is, in the words of whoever
   *  measures it, such as `12%`. Written beside the row. */
  set says(words) {
    this.words = words;
    if (this.figure) this.figure.textContent = words;
    this.setAttribute("aria-valuetext", words);
  }

  /** @param {string} words - The longest the row will say, such as `100%`.
   *  The figure takes that much room and stands against its right edge, so a
   *  figure that gains or loses a digit leaves the ones after it where they
   *  are. Left unsaid, the figure is as wide as what it says. */
  set widest(words) {
    this.longest = words;
    if (this.figure) this.figure.dataset.widest = words;
  }

  /** Lets the lamps follow the share given, a frame at a time, or shows it at
   *  once where the reader has asked for less movement. */
  follow() {
    if (!this.row) return;
    if (stillness()) {
      this.shown = this.held() ?? 0;
      this.draw();
      return;
    }
    if (this.frame) return;
    this.moved = undefined;
    this.frame = requestAnimationFrame((now) => this.step(now));
  }

  /**
   * Moves the lamps one frame's worth of the way to the share given.
   * @param {number} now - The frame's time, in milliseconds.
   *
   * By the time that has passed rather than by the frame, so the row takes
   * the same time on a screen that draws sixty frames a second as on one that
   * draws a hundred and twenty. A share that changes while the row is moving
   * is simply where it goes from then on.
   */
  step(now) {
    const goal = this.held() ?? 0;
    const passed = this.moved === undefined ? 0 : now - this.moved;
    this.moved = now;
    this.shown += (goal - this.shown) * (1 - Math.exp(-passed / LEDS_FOLLOW_MS));
    if (Math.abs(goal - this.shown) < LEDS_ARRIVED) this.shown = goal;
    this.draw();
    this.frame = this.shown === goal ? 0 : requestAnimationFrame((later) => this.step(later));
  }

  /** Lights as many lamps from the left as the share shown is of the row.
   *
   *  Rounded to the nearest lamp, so a row of twenty lights its first lamp at
   *  two and a half per cent and its last at ninety-seven and a half. */
  draw() {
    if (!this.row) return;
    const lamps = [...this.row.children];
    const lit = Math.round(this.shown / 100 * lamps.length);
    for (const [index, lamp] of lamps.entries()) {
      lamp.toggleAttribute("lit", index < lit);
    }
  }
}

/**
 * Defines every element the kit brings, and picks the front window.
 *
 * Called rather than done at import, so that whoever imports this
 * has put the words on the page before the first element is built.
 */
export function defineTheKit() {
  /** @type {[string, CustomElementConstructor][]} */
  const elements = [
  ["nx-window", NxWindow],
  ["nx-menu", NxMenu],
  ["nx-menu-item", NxMenuItem],
  ["nx-popup", NxPopup],
  ["nx-dock", NxDock],
  ["nx-tile", NxTile],
  ["nx-floor", NxFloor],
  ["nx-scroller", NxScroller],
  ["nx-shelf", NxShelf],
  ["nx-thing", NxThing],
  ["nx-ask", NxAsk],
  ["nx-notifications", NxNotifications],
  ["nx-notification", NxNotification],
  ["nx-viewer", NxViewer],
  ["nx-slider", NxSlider],
  ["nx-chart", NxChart],
  ["nx-leds", NxLeds],
  ];
  for (const [tag, type] of elements) {
    customElements.define(tag, type);
  }

  /* After the definitions, because every window has to exist and
     know whether it is open before one of them can be picked out as
     the front one. */
  restoreFront();
}

export {
  CHART_COLUMNS,
  CHART_LAMPS,
  DESK_WAS_NEW,
  FLIGHT_MS,
  GRIP_PX,
  LEDS_ARRIVED,
  LEDS_FOLLOW_MS,
  LEDS_HOT_FROM,
  LEDS_IN_A_ROW,
  LEDS_WARM_FROM,
  NEAR_FLIGHT_MS,
  NxAsk,
  NxChart,
  NxDock,
  NxFloor,

/* =========================================================================
   The desk itself, assembled from those parts.
   ========================================================================= */

/** The pictures, by the custom property build.py writes for each file. */
const Art = {
  Computer: "root",
  ComputerColor: "root-color",
};

/**
 * The machines Previous can be configured as, each with what the info window
 * shows once it is the current one.
 *
 * The picture is root.tiff either way, because NeXTSTEP had one machine icon
 * and drew every host with it. The only thing that changes is the tube: a
 * machine that could show colour shows colour, which is what somebody standing
 * in front of it would have seen.
 *
 * @type {ReadonlyArray<{id: string, name: string, art: string, cpu: string, ram: string, screen: string}>}
 */
const MACHINES = [
  { id: "next-computer",            name: "NeXT Computer",          art: Art.Computer,      cpu: "68030, 25 MHz", ram: "64 MB",  screen: "MegaPixel, Graustufen" },
  { id: "nextcube",                 name: "NeXTcube",               art: Art.Computer,      cpu: "68040, 25 MHz", ram: "64 MB",  screen: "MegaPixel, Graustufen" },
  { id: "nextcube-dimension",       name: "NeXTcube + Dimension",   art: Art.ComputerColor, cpu: "68040, 25 MHz", ram: "64 MB",  screen: "NeXTdimension, farbig" },
  { id: "nextcube-turbo",           name: "NeXTcube Turbo",         art: Art.Computer,      cpu: "68040, 33 MHz", ram: "128 MB", screen: "MegaPixel, Graustufen" },
  { id: "nextcube-turbo-dimension", name: "Cube Turbo + Dimension", art: Art.ComputerColor, cpu: "68040, 33 MHz", ram: "128 MB", screen: "NeXTdimension, farbig" },
  { id: "nextstation",              name: "NeXTstation",            art: Art.Computer,      cpu: "68040, 25 MHz", ram: "32 MB",  screen: "MegaPixel, Graustufen" },
  { id: "nextstation-color",        name: "NeXTstation Color",      art: Art.ComputerColor, cpu: "68040, 25 MHz", ram: "32 MB",  screen: "Trinitron, farbig" },
  { id: "nextstation-turbo",        name: "NeXTstation Turbo",      art: Art.Computer,      cpu: "68040, 33 MHz", ram: "128 MB", screen: "MegaPixel, Graustufen" },
  { id: "nextstation-turbo-color",  name: "Station Turbo Color",    art: Art.ComputerColor, cpu: "68040, 33 MHz", ram: "128 MB", screen: "Trinitron, farbig" },
];

/** Which machine the emulator is set to. Remembered with the rest of the desk. */
let current = recall("machine").id ?? "nextcube-turbo-dimension";

/** @param {string} id @returns {object|undefined} */
const byId = (id) => MACHINES.find((machine) => machine.id === id);

/** Fills the machine shelf. Each thing is draggable, which is the one gesture
 *  that changes the configuration. */
function drawShelf() {
  const shelf = document.getElementById("machines");
  shelf.replaceChildren(...MACHINES.map((machine) => {
    const thing = document.createElement("nx-thing");
    thing.setAttribute("icon", machine.art);
    thing.setAttribute("label", machine.name);
    if (machine.id === current) thing.setAttribute("chosen", "");
    thing.dataset.machine = machine.id;
    thing.draggable = true;
    return thing;
  }));
}

/* --- carrying a machine into the info window ---------------------------- */

/**
 * Asks before the configuration changes, and applies it where the answer is
 * yes.
 * @param {string} id - The machine that was dropped or double clicked.
 */
async function ask(id) {
  const machine = byId(id);
  if (!machine) return;
  const change = await document.getElementById("ask").ask({
    title: "Maschine wechseln",
    text: [
      `Als ${machine.name} starten?`,
      "NeXTSTEP wird heruntergefahren, Previous übernimmt die neue "
        + "Konfiguration und startet die Maschine neu.",
    ],
    icon: machine.art,
    confirm: "Wechseln",
    cancel: "Abbrechen",
  });
  if (change) apply(id);
}

/**
 * Writes the chosen machine into the info window and marks it in the shelf.
 * @param {string} id
 */
function apply(id) {
  const machine = byId(id);
  if (!machine) return;
  current = id;
  remember("machine", { id });
  showArt(document.getElementById("info-icon"), machine.art);
  document.getElementById("info-caption").textContent = machine.name;
  document.getElementById("info-cpu").textContent = machine.cpu;
  document.getElementById("info-ram").textContent = machine.ram;
  document.getElementById("info-screen").textContent = machine.screen;
  drawShelf();
}

document.addEventListener("dragstart", (event) => {
  const thing = event.target.closest?.("[data-machine]");
  if (!thing) return;
  event.dataTransfer.setData("text/plain", thing.dataset.machine);
  event.dataTransfer.effectAllowed = "copy";
  thing.setAttribute("lifting", "");
});

document.addEventListener("dragend", (event) => {
  event.target.closest?.("[data-machine]")?.removeAttribute("lifting");
});

for (const target of document.querySelectorAll("nx-window[drop]")) {
  target.addEventListener("dragover", (event) => {
    event.preventDefault();
    event.dataTransfer.dropEffect = "copy";
    target.setAttribute("droppable", "");
  });
  target.addEventListener("dragleave", (event) => {
    /* Moving onto a child fires dragleave on the parent, so only a pointer
       that has actually left the window counts. */
    if (!target.contains(event.relatedTarget)) target.removeAttribute("droppable");
  });
  target.addEventListener("drop", (event) => {
    event.preventDefault();
    target.removeAttribute("droppable");
    ask(event.dataTransfer.getData("text/plain"));
  });
}

document.addEventListener("dblclick", (event) => {
  const thing = event.target.closest?.("[data-machine]");
  if (thing) ask(thing.dataset.machine);
});

/* --- the console -------------------------------------------------------- */

/* In the finished tool this pane is a real session: a pseudo terminal on the
   Pi, carried over a WebSocket and drawn by a terminal emulator. Here it shows
   what such a session looks like, so the window can be judged before the
   plumbing behind it exists. */
const SESSION = [
  "Last login: Sat Sep 12 19:14:02 2026",
  "next@cube:~$ uptime",
  " 19:14:09 up 2:14,  1 user,  load average: 1.52",
  "next@cube:~$ pgrep -a previous",
  "1184 /usr/bin/previous -c previous.cfg",
  "next@cube:~$ ls -l ~/nextstep",
  "total 1972608",
  "-rw-r--r-- 1 next next 2020205390 Sep 12 02:41 NS33_2GB.dd",
  "-rw-r--r-- 1 next next     134144 Sep 12 02:41 Rev_3.3_v74.BIN",
  "-rw-r--r-- 1 next next     131072 Sep 12 02:41 ND_step1_v43.BIN",
  "next@cube:~$ vcgencmd measure_temp",
  "temp=51.6'C",
  "next@cube:~$ ",
];

/** Draws the session and the block cursor that follows it. */
function drawTerminal() {
  const pane = document.getElementById("terminal");
  pane.textContent = SESSION.join("\n");
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  pane.append(cursor);
}

defineTheKit();
drawShelf();
drawTerminal();
apply(current);
</script>
