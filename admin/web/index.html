<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeXTSTEP</title>
<!-- The kit first and this application's own second, because what is here
     names windows the kit only knows as windows. -->
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="nextstep.css">
<link rel="stylesheet" href="previously.css">
</head>
<body>

<!-- Every word a person reads is a key here rather than a sentence, and the
     catalogues in lang/ hold the sentences. The markup carries no text at all,
     so nothing can show the wrong language whilst the right one arrives. What
     stays as it is written are names: NeXT's, the machine's own, and the
     applications'. -->

<nx-menu name="menu" title="Cube" x="8" y="8">
  <nx-menu-item opens="info" key="i" data-t="window.info"></nx-menu-item>
  <nx-menu-item opens="pi" key="p">Raspberry Pi</nx-menu-item>
  <nx-menu-item opens="files" key="d" data-t="menu.files"></nx-menu-item>
  <nx-menu-item opens="preferences" key="e" data-t="app.preferences"></nx-menu-item>
  <nx-menu-item name="token" key="t" data-t="menu.token"></nx-menu-item>
</nx-menu>

<!-- The Workspace is always running and never carries the marks. The editor
     is in the dock and is not built, so it always does. -->
<nx-dock>
  <nx-tile icon="Workspace" title="NeXT"></nx-tile>
  <nx-tile icon="defaultAppIcon" data-t-title="app.config-editor"
           name="editor" app="/Apps/Config Editor.app"></nx-tile>
</nx-dock>

<!-- Where an application that is not in the dock puts its icon whilst it is
     running, from the left corner rightwards. -->
<nx-floor id="floor"></nx-floor>

<nx-window name="info" data-t-title="window.info" fixed drop x="180" y="16" w="400">
  <div class="info-body">
    <nx-portrait>
      <i class="art icon" id="info-icon" style="background-image: var(--root)"></i>
      <span class="caption" id="info-caption" data-t="info.reading"></span>
    </nx-portrait>
    <div class="readings">
      <nx-row><label data-t="info.state"></label><div class="state" id="info-state">&mdash;</div></nx-row>
      <nx-row><label data-t="info.processor"></label><nx-field id="info-cpu">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="info.memory"></label><nx-field id="info-ram">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="info.screen"></label><nx-field id="info-screen">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="info.disk"></label><nx-field id="info-disk">&mdash;</nx-field></nx-row>
    </div>
  </div>
  <!-- Under the picture and across the whole window, because the column
       beside the picture is 156 pixels wide and these three sentences measure
       152, 174 and 208. The same two questions the machine window asks about
       the file, in the same words, so that "Datei" means one thing wherever
       it appears. -->
  <div class="readings">
    <nx-row><label data-t="info.file"></label><nx-field id="info-file">&mdash;</nx-field></nx-row>
    <nx-row><label data-t="info.written"></label><nx-field id="info-written">&mdash;</nx-field></nx-row>
  </div>
  <p class="note" id="kiosk-note"></p>
  <div class="buttons">
    <button id="kiosk-stop" data-t="button.power-off"></button>
    <button id="kiosk-restart" data-t="button.restart"></button>
    <button id="kiosk-start" class="default" data-t="button.power-on"></button>
  </div>
</nx-window>

<nx-window name="pi" title="Raspberry Pi" fixed x="600" y="16" w="360" closed>
  <div class="readings">
    <nx-row><label data-t="pi.model"></label><nx-field id="pi-model">&mdash;</nx-field></nx-row>
    <nx-row><label data-t="pi.uptime"></label><nx-field id="pi-uptime">&mdash;</nx-field></nx-row>
    <nx-row><label data-t="pi.temperature"></label><div class="state" id="pi-temp">&mdash;</div></nx-row>
    <nx-row><label data-t="pi.power"></label><div class="state" id="pi-power">&mdash;</div></nx-row>
    <nx-row><label data-t="pi.emulator"></label><nx-field id="pi-emulator">&mdash;</nx-field></nx-row>
    <nx-row><label data-t="pi.sound"></label><div class="state" id="pi-sound">&mdash;</div></nx-row>
    <nx-row><label data-t="pi.memory"></label><nx-field id="pi-memory">&mdash;</nx-field></nx-row>
    <nx-row><label data-t="pi.card"></label><nx-field id="pi-disk">&mdash;</nx-field></nx-row>
  </div>
  <p class="note" id="pi-note"></p>
  <div class="buttons">
    <button id="pi-poweroff" data-t="button.power-off"></button>
    <button id="pi-reboot" data-t="button.restart"></button>
  </div>
</nx-window>

<!-- Everything this tool holds, arranged the way NeXTSTEP arranged things.
     The name is the window's own, not the machines': what is in it is two
     applications and two folders of machines. -->
<nx-window name="files" title="Previously" x="180" y="330" w="470" h="460"
           min-w="340" min-h="340" closed>
  <nx-viewer id="file-viewer"></nx-viewer>
  <p class="note" id="machine-note"></p>
</nx-window>

<!-- What one machine is, opened from the context menu in the shelf. Its title
     is the machine's own name, so two of these would never be confused. -->
<nx-window name="machine-info" data-t-title="window.machine" fixed x="640" y="400" w="400" closed>
  <div class="info-body">
    <nx-portrait>
      <i class="art icon" id="mi-icon" style="background-image: var(--root)"></i>
      <span class="caption" id="mi-caption">&mdash;</span>
    </nx-portrait>
    <div class="readings">
      <nx-row><label data-t="info.processor"></label><nx-field id="mi-cpu">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="info.memory"></label><nx-field id="mi-ram">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="info.screen"></label><nx-field id="mi-screen">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="info.dimension"></label><nx-field id="mi-dimension">&mdash;</nx-field></nx-row>
    </div>
  </div>
  <div class="readings">
    <nx-row><label data-t="info.chips"></label><nx-field id="mi-chips">&mdash;</nx-field></nx-row>
    <nx-row><label data-t="info.file"></label><nx-field id="mi-changed">&mdash;</nx-field></nx-row>
    <nx-row><label data-t="info.written"></label><nx-field id="mi-written">&mdash;</nx-field></nx-row>
  </div>
</nx-window>

<!-- What a right click on a machine offers. Put where the pointer is, and
     taken away again, so it is not carried about and not remembered. -->
<nx-menu name="machine-menu" context data-t-title="menu.machine">
  <!-- Reading before acting, and nothing between them: NeXTSTEP's own menus
       are one run of entries, with the submenu arrow and the shortcut letter
       the only things that break it. -->
  <nx-menu-item name="info" data-t="menu.machine-info"></nx-menu-item>
  <nx-menu-item name="activate" data-t="menu.activate"></nx-menu-item>
  <nx-menu-item name="edit" icon="defaultAppIcon" data-t="menu.edit"></nx-menu-item>
  <!-- Last, and the only one a folder on the shelf shows. The rule that takes
       the shadow off the foot of a menu asks for the last child, so the entry
       that can stand alone has to be it. The page writes its wording, which is
       one of two depending on where the thing already lies. -->
  <nx-menu-item name="shelf" data-t="menu.keep"></nx-menu-item>
</nx-menu>

<!-- Preferences, as NeXTSTEP built one: a row of module pictures across the
     top and the chosen module's panel underneath. The one module here is the
     one NeXTSTEP called Localization, and its picture and its name in each
     language are Preferences.app's own. -->
<nx-window name="preferences" data-t-title="app.preferences" fixed
           x="620" y="120" w="300" h="290" min-h="200" closed>
  <nx-shelf class="modules">
    <nx-thing icon="Localization" chosen></nx-thing>
  </nx-shelf>
  <p class="module-name" data-t="preferences.localization"></p>
  <nx-scroller>
    <div class="options" id="languages"></div>
  </nx-scroller>
</nx-window>

<!-- A real shell on the Pi, drawn by the one library this interface takes.
     Flush, because a terminal runs to its frame, and as tall as it is wide
     enough for eighty columns to start with. -->
<nx-window name="terminal" title="Terminal" flush drop
           x="180" y="330" w="574" h="420" min-w="320" min-h="200" closed>
  <nx-terminal id="session"></nx-terminal>
</nx-window>

<nx-ask id="ask"></nx-ask>

<!-- The words load first, then the kit, then the page. Every element is
     therefore built around text it already has rather than being filled in
     afterwards. -->
<script src="strings.js"></script>
<script src="lang/en.js"></script>
<script src="lang/de.js"></script>
<script src="lang/fr.js"></script>
<script src="lang/it.js"></script>
<script src="lang/es.js"></script>
<script src="lang/sv.js"></script>
<script>translate();</script>
<script src="nextstep.js"></script>
<!-- The one library this interface takes, and the view that uses it. Why it
     is not part of the kit is at the head of terminal.js. -->
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
<script src="terminal.js"></script>
<script src="app.js"></script>

</body>
</html>
