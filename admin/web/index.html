<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeXTSTEP</title>
<link rel="stylesheet" href="nextstep.css">
</head>
<body>

<nx-menu name="menu" title="Cube" x="8" y="8">
  <nx-menu-item opens="info" key="i">Info</nx-menu-item>
  <nx-menu-item opens="pi" key="p">Raspberry Pi</nx-menu-item>
  <nx-menu-item opens="files" key="d">Dateien</nx-menu-item>
  <nx-menu-item name="token" key="t">Token</nx-menu-item>
</nx-menu>

<nx-dock>
  <nx-tile icon="Workspace" title="NeXT"></nx-tile>
  <nx-tile icon="defaultAppIcon" title="Config Editor" name="editor"></nx-tile>
</nx-dock>

<nx-window name="info" title="Info" fixed drop x="180" y="16" w="400">
  <div class="info-body">
    <nx-portrait>
      <i class="art icon" id="info-icon" style="background-image: var(--root)"></i>
      <span class="caption" id="info-caption">wird gelesen</span>
    </nx-portrait>
    <div class="readings">
      <nx-row><label>Zustand</label><div class="state" id="info-state">&mdash;</div></nx-row>
      <nx-row><label>Prozessor</label><nx-field id="info-cpu">&mdash;</nx-field></nx-row>
      <nx-row><label>Speicher</label><nx-field id="info-ram">&mdash;</nx-field></nx-row>
      <nx-row><label>Bildschirm</label><nx-field id="info-screen">&mdash;</nx-field></nx-row>
      <nx-row><label>Platte</label><nx-field id="info-disk">&mdash;</nx-field></nx-row>
    </div>
  </div>
  <!-- Under the picture rather than beside it, because what it says does not
       fit in the narrow column, and only where there is something to say,
       which most of the time there is not. -->
  <div class="readings" id="info-file-row" hidden>
    <nx-row><label>Datei</label><nx-field id="info-file">&mdash;</nx-field></nx-row>
  </div>
  <p class="note" id="kiosk-note"></p>
  <div class="buttons">
    <button id="kiosk-stop">Ausschalten</button>
    <button id="kiosk-restart">Neu starten</button>
    <button id="kiosk-start" class="default">Einschalten</button>
  </div>
</nx-window>

<nx-window name="pi" title="Raspberry Pi" fixed x="600" y="16" w="360" closed>
  <div class="readings">
    <nx-row><label>Maschine</label><nx-field id="pi-model">&mdash;</nx-field></nx-row>
    <nx-row><label>Läuft</label><nx-field id="pi-uptime">&mdash;</nx-field></nx-row>
    <nx-row><label>Temperatur</label><div class="state" id="pi-temp">&mdash;</div></nx-row>
    <nx-row><label>Strom</label><div class="state" id="pi-power">&mdash;</div></nx-row>
    <nx-row><label>Emulator</label><nx-field id="pi-emulator">&mdash;</nx-field></nx-row>
    <nx-row><label>Ton</label><div class="state" id="pi-sound">&mdash;</div></nx-row>
    <nx-row><label>Speicher</label><nx-field id="pi-memory">&mdash;</nx-field></nx-row>
    <nx-row><label>Karte</label><nx-field id="pi-disk">&mdash;</nx-field></nx-row>
  </div>
  <p class="note" id="pi-note"></p>
  <div class="buttons">
    <button id="pi-poweroff">Ausschalten</button>
    <button id="pi-reboot">Neu starten</button>
  </div>
</nx-window>

<!-- Everything this tool holds, arranged the way NeXTSTEP arranged things.
     The name is the window's own, not the machines': what is in it is two
     applications and two folders of machines. -->
<nx-window name="files" title="Previously" x="180" y="330" w="470" h="460"
           min-w="340" min-h="340" closed>
  <nx-viewer id="file-viewer"></nx-viewer>
  <p class="note" id="machine-note"></p>
</nx-window>

<!-- What one machine is, opened from the context menu in the shelf. Its title
     is the machine's own name, so two of these would never be confused. -->
<nx-window name="machine-info" title="Maschine" fixed x="640" y="400" w="400" closed>
  <div class="info-body">
    <nx-portrait>
      <i class="art icon" id="mi-icon" style="background-image: var(--root)"></i>
      <span class="caption" id="mi-caption">&mdash;</span>
    </nx-portrait>
    <div class="readings">
      <nx-row><label>Prozessor</label><nx-field id="mi-cpu">&mdash;</nx-field></nx-row>
      <nx-row><label>Speicher</label><nx-field id="mi-ram">&mdash;</nx-field></nx-row>
      <nx-row><label>Bildschirm</label><nx-field id="mi-screen">&mdash;</nx-field></nx-row>
      <nx-row><label>Dimension</label><nx-field id="mi-dimension">&mdash;</nx-field></nx-row>
    </div>
  </div>
  <div class="readings">
    <nx-row><label>Chips</label><nx-field id="mi-chips">&mdash;</nx-field></nx-row>
    <nx-row><label>Datei</label><nx-field id="mi-changed">&mdash;</nx-field></nx-row>
    <nx-row><label>Geschrieben</label><nx-field id="mi-written">&mdash;</nx-field></nx-row>
  </div>
</nx-window>

<!-- What a right click on a machine offers. Put where the pointer is, and
     taken away again, so it is not carried about and not remembered. -->
<nx-menu name="machine-menu" context title="Maschine">
  <!-- Reading before acting, and nothing between them: NeXTSTEP's own menus
       are one run of entries, with the submenu arrow and the shortcut letter
       the only things that break it. -->
  <nx-menu-item name="info">Info&hellip;</nx-menu-item>
  <nx-menu-item name="activate">Activate config</nx-menu-item>
  <nx-menu-item name="edit" icon="defaultAppIcon">Edit config&hellip;</nx-menu-item>
  <!-- Last, and the only one a folder on the shelf shows. The rule that takes
       the shadow off the foot of a menu asks for the last child, so the entry
       that can stand alone has to be it. -->
  <nx-menu-item name="shelf">Auf die Ablage legen</nx-menu-item>
</nx-menu>

<nx-ask id="ask"></nx-ask>

<script src="nextstep.js"></script>
<script src="app.js"></script>

</body>
</html>
