<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeXTSTEP</title>

<link rel="stylesheet" href="previously.css">
</head>
<body>

<!-- Built by admin/build_web.py from admin/interface/. The sources are in the repository. -->

<nx-menu name="menu" title="Workspace" x="8" y="8">

  <nx-menu-item name="about-previously" data-t-key="menu.about-previously.key"
                data-t="menu.about-previously"></nx-menu-item>

  <nx-menu-item opens="pi" data-t-key="menu.info.key" data-t="window.info"></nx-menu-item>

  <nx-menu-item opens="info" name="about" data-t-key="menu.about.key" hidden></nx-menu-item>
  <nx-menu-item opens="files" data-t-key="menu.files.key" data-t="menu.files"></nx-menu-item>

  <nx-menu-item opens="activity" data-t-key="menu.activity-monitor.key" data-t="app.activity-monitor"></nx-menu-item>
  <nx-menu-item opens="preferences" data-t-key="menu.preferences.key" data-t="app.preferences"></nx-menu-item>
  <nx-menu-item name="password" data-t-key="menu.password.key" data-t="menu.password"></nx-menu-item>

  <nx-menu-item for="grab" name="grab-take" data-t-key="grab.take.key" data-t="grab.take"></nx-menu-item>
  <nx-menu-item for="grab" name="grab-save" data-t-key="menu.save.key" data-t="menu.save"></nx-menu-item>
  <nx-menu-item for="grab" name="quit" data-t-key="menu.quit.key" data-t="menu.quit"></nx-menu-item>

  <nx-menu-item for="preview" name="preview-save" data-t-key="menu.save.key" data-t="menu.save"></nx-menu-item>
  <nx-menu-item for="preview" name="preview-delete" data-t-key="menu.delete.key" data-t="menu.delete"></nx-menu-item>
  <nx-menu-item for="preview" name="quit" data-t-key="menu.quit.key" data-t="menu.quit"></nx-menu-item>
  <nx-menu-item for="terminal" name="quit" data-t-key="menu.quit.key" data-t="menu.quit"></nx-menu-item>
  <nx-menu-item for="installer" name="quit" data-t-key="menu.quit.key" data-t="menu.quit"></nx-menu-item>
  <nx-menu-item for="preferences" name="quit" data-t-key="menu.quit.key" data-t="menu.quit"></nx-menu-item>
  <nx-menu-item for="activity" name="quit" data-t-key="menu.quit.key" data-t="menu.quit"></nx-menu-item>

  <nx-menu-item for="editor" name="editor-save" data-t-key="menu.save.key" data-t="menu.save"></nx-menu-item>
  <nx-menu-item for="editor" name="quit" data-t-key="menu.quit.key" data-t="menu.quit"></nx-menu-item>
</nx-menu>

<nx-dock>
  <nx-tile icon="Workspace" title="NeXT" fixed></nx-tile>

  <nx-tile icon="defaultAppIcon" data-t-title="app.config-editor"
           name="editor" app="/Apps/Config Editor.app"></nx-tile>
</nx-dock>

<nx-floor id="floor"></nx-floor>

<nx-window name="info" fixed drop x="180" y="16" w="400">
  <div class="info-body">
    <nx-portrait>
      <i class="art icon" id="info-icon" style="background-image: var(--root)"></i>
      <span class="caption" id="info-caption" data-t="info.reading"></span>
    </nx-portrait>
    <div class="readings">
      <nx-row><label data-t="info.state"></label><div class="state" id="info-state">&mdash;</div></nx-row>
      <nx-row><label data-t="info.processor"></label><nx-field id="info-cpu">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="info.memory"></label><nx-field id="info-ram">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="info.screen"></label><nx-field id="info-screen">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="info.disk"></label><nx-field id="info-disk">&mdash;</nx-field></nx-row>
    </div>
  </div>

  <div class="readings">
    <nx-row><label data-t="info.file"></label><nx-field id="info-file">&mdash;</nx-field></nx-row>
    <nx-row><label data-t="info.written"></label><nx-field id="info-written">&mdash;</nx-field></nx-row>
  </div>
  <p class="note" id="kiosk-note"></p>
  <div class="buttons">
    <button id="kiosk-stop" data-t="button.power-off"></button>
    <button id="kiosk-restart" data-t="button.restart"></button>
    <button id="kiosk-start" data-t="button.power-on"></button>
  </div>
</nx-window>

<nx-window name="pi" data-t-title="window.info" fixed x="600" y="16" w="360" closed>
  <div class="readings">
    <nx-row><label data-t="pi.model"></label><nx-field id="pi-model">&mdash;</nx-field></nx-row>
    <nx-row><label data-t="pi.uptime"></label><nx-field id="pi-uptime">&mdash;</nx-field></nx-row>
    <nx-row><label data-t="pi.temperature"></label><div class="state" id="pi-temp">&mdash;</div></nx-row>
    <nx-row><label data-t="pi.power"></label><div class="state" id="pi-power">&mdash;</div></nx-row>
    <nx-row><label data-t="pi.sound"></label><div class="state" id="pi-sound">&mdash;</div></nx-row>

    <nx-row><label data-t="pi.crashes"></label><div class="state" id="pi-crashes">&mdash;</div></nx-row>
    <nx-row><label data-t="pi.memory"></label><nx-field id="pi-memory">&mdash;</nx-field></nx-row>
    <nx-row><label data-t="pi.card"></label><nx-field id="pi-disk">&mdash;</nx-field></nx-row>

    <nx-row><label>Previously</label><nx-field id="pi-version">&mdash;</nx-field></nx-row>

    <nx-row>
      <label data-t="pi.newest"></label>

      <div class="beside">
        <nx-field id="pi-newest">&mdash;</nx-field>
        <button id="pi-notes" data-t="button.release-notes"></button>
      </div>
    </nx-row>
    <nx-row><label data-t="pi.emulator"></label><nx-field id="pi-emulator">&mdash;</nx-field></nx-row>
  </div>

  <div class="gauge" id="pi-update-gauge" hidden>
    <div class="gauge-fill" id="pi-update-fill"></div>
  </div>

  <p class="note" id="pi-update-note"></p>
  <p class="note" id="pi-note"></p>
  <div class="buttons">
    <button id="pi-poweroff" data-t="button.power-off"></button>
    <button id="pi-reboot" data-t="button.restart"></button>

    <button id="pi-update" data-t="button.update" hidden></button>
  </div>
</nx-window>

<nx-window name="activity" data-t-title="app.activity-monitor" fixed
           x="620" y="300" w="470" closed>
  <div class="readings" id="activity-cores"></div>
  <div class="readings">
    <nx-row><label data-t="pi.memory"></label><nx-leds id="activity-memory"></nx-leds></nx-row>
    <nx-row><label data-t="activity.load"></label><nx-field id="activity-load">&mdash;</nx-field></nx-row>
    <nx-row><label data-t="pi.emulator"></label><nx-field id="activity-emulator">&mdash;</nx-field></nx-row>
  </div>
  <p class="note" id="activity-note"></p>
</nx-window>

<nx-window name="files" title="Previously" x="180" y="330" w="470" h="480"
           min-w="340" min-h="340" closed>
  <nx-viewer id="file-viewer"></nx-viewer>
  <p class="note" id="machine-note"></p>
</nx-window>

<nx-window name="machine-info" data-t-title="window.machine" fixed x="640" y="400" w="400" closed>
  <div class="info-body">
    <nx-portrait>
      <i class="art icon" id="mi-icon" style="background-image: var(--root)"></i>
      <span class="caption" id="mi-caption">&mdash;</span>
    </nx-portrait>
    <div class="readings">
      <nx-row><label data-t="info.processor"></label><nx-field id="mi-cpu">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="info.memory"></label><nx-field id="mi-ram">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="info.screen"></label><nx-field id="mi-screen">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="info.dimension"></label><nx-field id="mi-dimension">&mdash;</nx-field></nx-row>
    </div>
  </div>
  <div class="readings">
    <nx-row><label data-t="info.chips"></label><nx-field id="mi-chips">&mdash;</nx-field></nx-row>
    <nx-row><label data-t="info.file"></label><nx-field id="mi-changed">&mdash;</nx-field></nx-row>
    <nx-row><label data-t="info.written"></label><nx-field id="mi-written">&mdash;</nx-field></nx-row>
  </div>
</nx-window>

<nx-window name="editor" data-t-title="app.config-editor" fixed drop
           x="220" y="90" w="470" closed>
  <div class="info-body">
    <nx-portrait>
      <i class="art icon" id="editor-icon" style="background-image: var(--root)"></i>
      <span class="caption" id="editor-caption">&mdash;</span>
    </nx-portrait>

    <div class="readings">
      <nx-row><label data-t="info.processor"></label><nx-field id="editor-cpu">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="info.memory"></label><nx-field id="editor-ram">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="info.screen"></label><nx-field id="editor-screen">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="info.chips"></label><nx-field id="editor-chips">&mdash;</nx-field></nx-row>
    </div>
  </div>

  <div class="choices subjects" id="editor-subjects"></div>

  <div class="editor-groups">
    <fieldset class="group" subject="machine">
      <legend data-t="editor.machine"></legend>
      <div class="choices" id="editor-kinds"></div>
      <p class="note" id="editor-kinds-note"></p>
    </fieldset>
    <fieldset class="group" subject="machine" id="editor-boards-group">
      <legend data-t="editor.boards"></legend>
      <div class="choices" id="editor-boards"></div>
      <p class="note" id="editor-boards-note"></p>
    </fieldset>
    <fieldset class="group" subject="processor">
      <legend data-t="editor.clock"></legend>
      <nx-slider id="editor-clocks"></nx-slider>
      <p class="note" id="editor-clocks-note"></p>
    </fieldset>
    <fieldset class="group" subject="processor">
      <legend data-t="editor.dsp"></legend>
      <div class="choices" id="editor-dsps"></div>
      <p class="note" id="editor-dsps-note"></p>
    </fieldset>
    <fieldset class="group" subject="processor" id="editor-dsp-memory-group">
      <legend data-t="editor.dsp-memory"></legend>
      <div class="choices" id="editor-dsp-memory"></div>
      <p class="note" id="editor-dsp-memory-note"></p>
    </fieldset>
    <fieldset class="group" subject="memory">
      <legend data-t="info.memory"></legend>
      <nx-slider id="editor-memory"></nx-slider>
      <p class="note" id="editor-memory-note"></p>
    </fieldset>
    <fieldset class="group" subject="memory">
      <legend data-t="editor.banks"></legend>
      <div class="banks" id="editor-banks"></div>
      <p class="note" id="editor-banks-note"></p>
    </fieldset>
    <fieldset class="group" subject="graphics" id="editor-dimension-group">
      <legend data-t="editor.dimension"></legend>
      <div class="choices" id="editor-dimensions"></div>
      <p class="note" id="editor-dimensions-note"></p>
    </fieldset>

    <div class="boards-memory" id="editor-dimension-memory" subject="graphics"></div>
    <fieldset class="group" subject="fitted">
      <legend data-t="editor.drives"></legend>
      <div class="choices" id="editor-drives"></div>
      <p class="note" id="editor-drives-note"></p>
    </fieldset>
    <fieldset class="group" subject="fitted">
      <legend data-t="editor.ports"></legend>
      <div class="choices" id="editor-ports"></div>
      <p class="note" id="editor-ports-note"></p>
    </fieldset>
    <fieldset class="group" subject="fitted" id="editor-socket-group">
      <legend data-t="editor.socket"></legend>
      <div class="choices" id="editor-sockets"></div>
      <p class="note" id="editor-sockets-note"></p>
    </fieldset>
  </div>
  <p class="note" id="editor-note"></p>
  <div class="buttons">
    <button id="editor-save" data-t="button.save-as"></button>
  </div>
</nx-window>

<nx-window name="installer" data-t-title="app.installer" fixed
           x="260" y="120" w="470" closed>
  <div class="info-body">
    <nx-portrait>
      <i class="art icon" id="installer-icon" style="background-image: var(--Installer)"></i>
      <span class="caption" id="installer-caption">&mdash;</span>
    </nx-portrait>
    <div class="readings">
      <nx-row><label data-t="installer.emulator"></label><nx-field id="installer-emulator">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="installer.systems"></label><nx-field id="installer-count">&mdash;</nx-field></nx-row>
      <nx-row><label data-t="installer.card"></label><nx-field id="installer-room">&mdash;</nx-field></nx-row>
    </div>
  </div>

  <div class="choices subjects" id="installer-tabs"></div>
  <div class="installer-groups">
    <fieldset class="group" subject="emulator">
      <legend data-t="installer.emulator.title"></legend>

      <p class="note" id="installer-emulator-note"></p>
      <div class="buttons">
        <button id="installer-remove" data-t="button.remove"></button>
        <button id="installer-update" data-t="button.update"></button>
        <button id="installer-install" data-t="button.install"></button>
      </div>
    </fieldset>
    <fieldset class="group" subject="systems">
      <legend data-t="installer.systems"></legend>

      <div class="systems" id="installer-systems"></div>
      <p class="note" id="installer-systems-note"></p>
      <div class="buttons">
        <button id="installer-forget" data-t="button.remove"></button>
        <button id="installer-fetch" data-t="button.fetch"></button>
        <button id="installer-activate" data-t="button.activate"></button>
      </div>
    </fieldset>
  </div>

  <div class="gauge" id="installer-gauge" hidden>
    <div class="gauge-fill" id="installer-fill"></div>
  </div>
  <p class="note" id="installer-note"></p>
</nx-window>

<nx-menu name="machine-menu" context data-t-title="menu.machine">

  <nx-menu-item name="info" data-t="menu.machine-info"></nx-menu-item>
  <nx-menu-item name="activate" data-t="menu.activate"></nx-menu-item>
  <nx-menu-item name="edit" icon="defaultAppIcon" data-t="menu.edit"></nx-menu-item>

  <nx-menu-item name="rename" data-t="menu.rename"></nx-menu-item>
  <nx-menu-item name="remove" data-t="menu.remove"></nx-menu-item>

  <nx-menu-item name="backup" data-t="menu.backup"></nx-menu-item>
  <nx-menu-item name="restore" data-t="menu.restore"></nx-menu-item>

  <nx-menu-item name="disc" data-t="menu.insert"></nx-menu-item>

  <nx-menu-item name="shelf" data-t="menu.keep"></nx-menu-item>
</nx-menu>

<nx-menu name="picture-menu" context data-t-title="menu.picture">
  <nx-menu-item name="delete" data-t="menu.delete"></nx-menu-item>
</nx-menu>

<nx-window name="preferences" data-t-title="app.preferences" fixed
           x="560" y="120" w="440" h="330" min-h="240" closed>

  <nx-scroller class="modules" bars="across">
    <div class="module-row">
      <div class="module" value="localization" chosen><i class="art"></i></div>
      <div class="module" value="monitor"><i class="art"></i></div>
    </div>
  </nx-scroller>
  <p class="module-name" id="module-name"></p>

  <nx-scroller>
   <div class="module-panel">
    <div class="options" id="languages"></div>
    <div class="module-page" id="sizes" hidden>

      <fieldset class="group">
        <legend data-t="size.title"></legend>
        <div class="choices" id="size-choices"></div>
      </fieldset>
    </div>
   </div>
  </nx-scroller>
</nx-window>

<nx-window name="terminal" title="Terminal" flush drop
           x="180" y="330" w="694" h="436" min-w="320" min-h="200" closed>
  <nx-scroller>
    <nx-terminal id="session"></nx-terminal>
  </nx-scroller>
</nx-window>

<nx-window name="grab" data-t-title="app.grab" drop
           x="600" y="330" w="576" h="480" min-w="320" min-h="260" closed>
  <nx-scroller>
    <div class="shot" id="shot"></div>
  </nx-scroller>
  <p class="note" id="shot-note"></p>
  <div class="buttons">
    <button id="shot-take" data-t="grab.take"></button>
  </div>
</nx-window>

<nx-window name="preview" data-t-title="app.preview" drop
           x="640" y="120" w="576" h="480" min-w="320" min-h="240" closed>

  <nx-scroller>
    <div class="shot" id="preview-picture"></div>
    <div class="document" id="preview-document" hidden></div>
  </nx-scroller>
  <p class="note" id="preview-note"></p>
</nx-window>

<nx-ask id="ask"></nx-ask>

<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
<script src="previously.js"></script>

</body>
</html>
