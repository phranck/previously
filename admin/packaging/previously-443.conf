# Lets the service listen on 443, so the address carries no port number.
#
# Install as a drop-in and set port = 443 in /etc/previously/config.ini:
#   sudo mkdir -p /etc/systemd/system/previously.service.d
#   sudo cp packaging/previously-443.conf /etc/systemd/system/previously.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart previously
#
# Optional. Without it the service answers on 8088 over TLS just as well, and
# the address carries :8088.

[Service]
# Ports below 1024 need this capability. Granting it beats running as root,
# which is what the alternative amounts to.
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE

# And only that one port. The capability on its own would allow any privileged
# port, including ones something else on this machine expects to own.
SocketBindAllow=tcp:443
SocketBindDeny=any
