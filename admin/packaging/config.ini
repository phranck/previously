# The admin tool's own configuration. Every key here is the default, so a
# fresh installation runs whether this file exists or not.

[service]
# Reachable from the home network, because the Pi has no browser of its own.
# Never from the internet: nothing forwards a port to this.
address = 0.0.0.0
port = 8810

# The emulator's configuration, in the home of the user this service runs as.
previous_config = ~/.config/previous/previous.cfg

# The configurations somebody saved. In their home rather than under /var/lib,
# because they are theirs: purging this package takes the state directory below
# with it and must not take away the machines somebody built. The unit opens this
# one path for writing and the package creates the directory.
machines_file = ~/.config/previously/machines.json

# The real part of the tree the File Viewer shows, which today is the folder it
# shows as Documents/Pictures. Grab writes a screenshot there and Preview reads
# it back.
documents = ~/Previously

# The unit that holds the emulator on the first console.
kiosk_unit = getty@tty1.service

# What this service keeps between one start and the next, which is its own
# rather than anybody's: the password and the digest of the last configuration
# it wrote. Its systemd unit creates this directory through StateDirectory=, and
# a purge of the package takes it away.
state_directory = /var/lib/previously

# What it keeps only whilst the machine is up, which is the file that holds the
# emulator down. A tmpfs, so a machine that has just booted runs its emulator
# whoever switched it off before the last shutdown.
runtime_directory = /run/previously

# A hash of the password somebody chose in the interface, which is what a
# request proves before it may change anything. Nothing writes this until the
# first browser arrives and chooses one. Removing it leaves the machine
# unclaimed, and the next browser sets a new password:
#   sudo rm /var/lib/previously/password
password_file = /var/lib/previously/password
