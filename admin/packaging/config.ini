# The admin tool's own configuration. Every key here is the default, so a
# fresh installation runs whether this file exists or not.

[service]
# Reachable from the home network, because the Pi has no browser of its own.
# Never from the internet: nothing forwards a port to this.
address = 0.0.0.0
port = 8088

# The emulator's configuration, in the home of the user this service runs as.
previous_config = ~/.config/previous/previous.cfg

# The unit that holds the emulator on the first console.
kiosk_unit = getty@tty1.service

# The secret that a request has to carry before it may change anything. The
# service writes one here on first start if there is none. Read it with
#   sudo cat /var/lib/previously/token
token_file = /var/lib/previously/token

# Serving over HTTPS. Empty means plain HTTP, which is what an installation
# reachable only as cube.local is stuck with: no public authority issues a
# certificate for a name in .local. Give the machine a name under a domain you
# own and these two point at the certificate for it.
#
# packaging/certificate-hook.sh puts a renewed certificate here and restarts
# the service, so nothing has to be copied by hand every sixty days.
certificate =
private_key =
