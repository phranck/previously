# The admin tool's own configuration. Every key here is the default, so a
# fresh installation runs whether this file exists or not.

[service]
# Reachable from the home network, because the Pi has no browser of its own.
# Never from the internet: nothing forwards a port to this.
address = 0.0.0.0
port = 8088

# The emulator's configuration, in the home of the user this service runs as.
previous_config = ~/.config/previous/previous.cfg

# The unit that holds the emulator on the first console.
kiosk_unit = getty@tty1.service
