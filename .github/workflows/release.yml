# Builds the admin tool's package and puts it on a draft release for a tag,
# once the checks in check.yml have passed for that tag.
#
# A draft, because a release is never public without its package. The draft is
# made public by hand once the package on it has been checked, with
# `gh release edit vX.Y.Z --draft=false --latest`. A run that fails therefore
# leaves a tag and no release, and nobody installs from a tag.
#
# The package is Architecture: all, so nothing here has to run on a Pi: it is
# Python, static files and seven unit files copied into place. Ubuntu's runner
# has dpkg-deb, which is all the build needs.
#
# The name it is attached under carries no version, so
# releases/latest/download/previously_all.deb is always the newest one. That is
# where install.sh fetches from when it runs with no checkout beside it, which
# is how the line on previous.li installs this.
#
# Nothing here puts anything from an event into a command. The only expressions
# are github.ref in two conditions, which decide whether a step runs and are
# never interpolated into a shell.
#
# Every action is pinned to the commit of a release, with that release beside
# it. A tag can be moved to other code by whoever owns the action, and the
# packaging job's token can rewrite releases, so only a change in this file
# changes what runs here. Raising an action means reading the commit of its
# new release off its own repository and writing both down.

name: Release

on:
  push:
    tags: ["v*"]
  # So the build can be exercised without spending a tag on it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The checks every pull request runs, so nothing is packaged that they
  # refuse. Read only, and named again here, because a job that calls another
  # workflow and names no permissions hands it the token's defaults.
  check:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  package:
    needs: check
    runs-on: ubuntu-latest
    # The one job that writes, because it puts the package on a release.
    permissions:
      contents: write
    # A run that hangs is worse than one that fails: it says nothing and holds
    # the tag.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history and every tag, because the package is numbered
          # from what `git describe` says and the default checkout takes one
          # commit and no tags at all.
          fetch-depth: 0

      - name: Build the package
        working-directory: admin
        run: |
          python3 packaging/build.py
          cp packaging/build/previously_*_all.deb packaging/build/previously_all.deb
          dpkg-deb --info packaging/build/previously_all.deb

      # Creates the release as a draft with the package on it. A release that
      # is public already keeps that state, because the action leaves an
      # existing release's draft flag as it found it.
      - name: Put it on a draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: admin/packaging/build/previously_all.deb
          fail_on_unmatched_files: true

      - name: Keep it on the run, where there is no tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previously_all.deb
          path: admin/packaging/build/previously_all.deb
          if-no-files-found: error
